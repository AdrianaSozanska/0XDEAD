    <text x="20" y="60">10x0D</text>
    <text x="20" y="80">DEAD0</text>
    <text x="60" y="30">1x0101</text>
    <text x="60" y="90">0xDEAD</text>
    <text x="60" y="130">010010</text>
    <text x="110" y="50">0x0000</text>
    <text x="110" y="100">DEAD01</text>
    <text x="160" y="35">10DEAD</text>
    <text x="160" y="95">0x1101</text>
    <text x="210" y="55">DEAD10</text>
    <text x="260" y="40">0x0DEA</text>
    <text x="310" y="60">1001DE</text>
    <text x="360" y="45">AD0x01</text>
  </g>

  <rect x="24" y="24" width="372" height="552" fill="none" stroke="url(#glow)" stroke-width="2"/>

  <text x="210" y="470" font-family="'Share Tech Mono', monospace" font-size="40" font-weight="bold" fill="#39ff14" text-anchor="middle">0xDEAD</text>
  <text x="210" y="505" font-family="'Share Tech Mono', monospace" font-size="20" fill="#00e5ff" text-anchor="middle">КОД СМЕРТІ</text>

  <text x="210" y="560" font-family="monospace" font-size="12" fill="#7f9c95" text-anchor="middle">[ ЗАПОВНЮВАЧ ОБКЛАДИНКИ — COVER PLACEHOLDER ]</text>
